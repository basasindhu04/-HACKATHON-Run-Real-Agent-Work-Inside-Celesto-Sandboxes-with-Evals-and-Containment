version: "3.8"

services:
  ledger:
    image: postgres:16-alpine
    container_name: celesto-ledger-db
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    container_name: celesto-run-ledger-api
    ports:
      - "8080:8080"
    depends_on:
      ledger:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://ledger:ledger@ledger:5432/ledger
      - API_PORT=8080
      - CELESTO_PROVIDER=${CELESTO_PROVIDER:-cloud}
      - CELESTO_API_KEY=${CELESTO_API_KEY:-replace-me}
      - CELESTO_BACKEND=${CELESTO_BACKEND:-firecracker}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://example-llm-host/v1}
      - LLM_API_KEY=${LLM_API_KEY:-replace-me}
      - LLM_MODEL=${LLM_MODEL:-replace-with-a-model-name}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
